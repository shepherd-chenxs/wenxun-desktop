name: Release

# 只在推送 v* 标签时打包发版；workflow_dispatch 用于手动试跑（只出产物，不建 Release）
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Windows 安装包
    runs-on: windows-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      sha256: ${{ steps.meta.outputs.sha256 }}
      asset: ${{ steps.meta.outputs.asset }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 Rust 构建产物
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: 安装前端依赖
        run: npm ci

      - name: 校验 tag 与版本号一致
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
            ver=$(node -p "require('./package.json').version")
            cargo_ver=$(grep -m1 '^version' src-tauri/Cargo.toml | cut -d'"' -f2)
            echo "tag=$tag package.json=$ver Cargo.toml=$cargo_ver"
            if [ "$tag" != "v$ver" ]; then
              echo "::error::tag $tag 与 package.json 的 $ver 不一致"
              exit 1
            fi
            if [ "$ver" != "$cargo_ver" ]; then
              echo "::error::package.json($ver) 与 Cargo.toml($cargo_ver) 版本不一致"
              exit 1
            fi
          fi

      - name: 编译并打包（vite build + cargo release + NSIS）
        run: npm run tauri:build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ''

      - name: 归一产物名并计算校验值
        id: meta
        shell: bash
        run: |
          ver=$(node -p "require('./package.json').version")
          # 安装包是中文名（文迅_2.5.1_x64-setup.exe），GitHub Release 会丢掉中文，统一改成 ASCII
          src=$(ls release/*-setup.exe | head -1)
          asset="wenxun_${ver}_x64-setup.exe"
          cp "$src" "release/$asset"
          sha=$(sha256sum "release/$asset" | cut -d' ' -f1)
          echo "源文件: $src"
          echo "产物名: $asset"
          echo "SHA256: $sha"
          {
            echo "version=$ver"
            echo "asset=$asset"
            echo "sha256=$sha"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: installer
          path: release/wenxun_*-setup.exe
          if-no-files-found: error
          retention-days: 7

  publish:
    name: 发布 Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: installer
          path: dist

      - name: 创建 Release 并上传安装包
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
          name: 文迅 ${{ needs.build.outputs.version }}
          body: |
            ## 文迅 ${{ needs.build.outputs.version }}

            Windows 安装包（NSIS / x64）

            - 文件：`${{ needs.build.outputs.asset }}`
            - SHA256：`${{ needs.build.outputs.sha256 }}`

            > 安装包未做代码签名，Windows 可能提示“未知发布者”，选择“仍要运行”即可。
          fail_on_unmatched_files: true
