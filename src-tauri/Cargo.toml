[package]
name = "wenxun"
version = "2.5.1"
edition = "2021"
license = "MIT"

[lib]
name = "wenxun"
path = "src/lib.rs"

[[bin]]
name = "wenxun-app"
path = "src/main.rs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
tauri = { version = "2.5.6", features = ["default"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-log = "2"
tauri-plugin-single-instance = "2"
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.29.0", features = ["bundled"] }
tokio = { version = "1.28.0", features = ["full"] }
chrono = "0.4.24"
reqwest = { version = "0.11.20", features = ["json", "multipart", "cookies"] }
aes-gcm = "0.10.1"
rand = "0.8.5"
urlencoding = "2"
hex = "0.4.3"
sha2 = "0.10"
scraper = "0.20"
regex = "1.12"

[dev-dependencies]
tokio-test = "0.4"
mockall = "0.11"

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[features]
# this feature is used for production builds or when `devPath` points to the filesystem
# DO NOT remove this
custom-protocol = ["tauri/custom-protocol"]
